<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratorio CI/CD | Frontend Java</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #eef5ff, #ffffff); min-height: 100vh; }
    .panel { max-width: 700px; }
    .brand { letter-spacing: .12em; color: #315ca3; font-weight: 800; font-size: .8rem; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-4">
  <main class="card panel w-100 border-0 shadow-lg rounded-4 p-4 p-md-5 text-center">
    <div class="brand mb-3">LABORATORIO CI/CD · JAVA 21</div>
    <h1 class="display-6 fw-bold">Mi primera página con Java</h1>
    <p class="lead text-secondary">Una sola página <code>index.html</code> publicada desde una aplicación Java.</p>
    <div class="d-flex flex-wrap gap-2 justify-content-center my-3">
      <span class="badge text-bg-primary p-2">Maven</span>
      <span class="badge text-bg-dark p-2">GitHub</span>
      <span class="badge text-bg-success p-2">Cloud Run</span>
    </div>
    <button id="saludar" type="button" class="btn btn-primary btn-lg mx-auto px-4">Mostrar mensaje</button>
    <p id="mensaje" class="mt-3 mb-0 fw-semibold" role="status" aria-live="polite">Presiona el botón para iniciar.</p>
    <hr class="my-4">
    <small class="text-secondary">Frontend HTML + Bootstrap · Servidor Java Spring Boot · Sin base de datos</small>
  </main>
  <script>
    document.querySelector('#saludar').addEventListener('click', () => {
      document.querySelector('#mensaje').textContent = '¡Excelente! La página responde correctamente.';
    });
  </script>
</body>
</html>
